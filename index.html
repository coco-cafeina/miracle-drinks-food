<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#7b2d26">

<title>Miracle Drinks and Food</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

background:#fffaf6;

color:#2b211e;

font-family:Arial,sans-serif;

padding-bottom:78px

}

header{

background:linear-gradient(135deg,#6f241f,#b85b42);

color:#fff;

padding:28px 18px;

border-radius:0 0 28px 28px

}

.wrap{

max-width:720px;

margin:auto;

padding:18px

}

h1{

margin:0;

font-size:29px

}

header p{

margin:7px 0 0;

opacity:.9

}

.badge{

display:inline-block;

margin-top:12px;

padding:7px 12px;

border-radius:20px;

background:#fff1eb;

color:#7b2d26;

font-size:13px

}

h2{

font-size:21px;

margin:20px 0 12px

}

/* SEARCH */

.search-box{

width:100%;

padding:14px 16px;

border:1px solid #ddd;

border-radius:14px;

font-size:16px;

outline:none;

background:#fff;

margin-top:8px;

box-shadow:0 3px 12px #00000008

}

.search-box:focus{

border-color:#7b2d26

}

/* FILTER */

.filters{

display:flex;

gap:8px;

overflow-x:auto;

padding:12px 0 4px;

scrollbar-width:none

}

.filters::-webkit-scrollbar{

display:none

}

.filter-btn{

white-space:nowrap;

border:1px solid #7b2d26;

background:#fff;

color:#7b2d26;

padding:9px 13px;

border-radius:20px;

font-size:13px;

font-weight:bold

}

.filter-btn.active{

background:#7b2d26;

color:#fff

}

/* PRODUCTS */

.grid{

display:grid;

gap:12px

}

.card{

background:#fff;

padding:0;

border-radius:17px;

overflow:hidden;

box-shadow:0 4px 18px #00000010;

position:relative

}

.photo{

width:100%;

height:190px;

object-fit:cover;

display:block;

cursor:pointer;

-webkit-touch-callout:none;

-webkit-user-select:none;

user-select:none;

-webkit-user-drag:none

}

.info{

padding:14px 15px 16px;

display:flex;

align-items:center;

justify-content:space-between;

gap:12px

}

.card h3{

margin:0 0 4px;

font-size:17px

}

.description{

font-size:13px;

color:#777;

line-height:1.4;

margin:0 0 6px

}

.price{

font-weight:bold;

color:#7b2d26;

font-size:17px

}

.add{

border:0;

border-radius:11px;

padding:10px 14px;

font-weight:bold;

background:#7b2d26;

color:#fff;

flex-shrink:0

}

/* POPULAR BADGE */

.popular{

position:absolute;

top:12px;

left:12px;

background:#fff;

color:#7b2d26;

padding:6px 10px;

border-radius:18px;

font-size:12px;

font-weight:bold;

box-shadow:0 3px 10px #00000025;

z-index:2

}

.no-results{

text-align:center;

padding:25px 10px;

color:#777;

background:#fff;

border-radius:15px

}

/* CART */

.cart{

margin-top:25px;

background:#fff;

padding:18px;

border-radius:18px;

box-shadow:0 4px 18px #00000010

}

.item{

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #eee;

padding:9px 0;

gap:10px

}

.qty button{

padding:5px 9px;

margin-left:4px

}

.total{

font-size:19px;

font-weight:bold;

margin:14px 0

}

input,textarea{

width:100%;

padding:12px;

margin:5px 0 9px;

border:1px solid #ddd;

border-radius:11px;

font-size:15px

}

.order{

width:100%;

background:#25d366;

color:white;

font-size:16px;

margin-top:8px;

border:0;

border-radius:11px;

padding:12px

}

.empty{

color:#777

}

footer{

text-align:center;

color:#888;

font-size:12px;

padding:25px

}

/* SLIM STICKY CART */

.sticky-cart{

position:fixed;

bottom:12px;

left:50%;

transform:translateX(-50%);

width:calc(100% - 32px);

max-width:680px;

background:#7b2d26;

color:#fff;

border:0;

border-radius:14px;

padding:11px 16px;

font-size:15px;

font-weight:bold;

box-shadow:0 5px 16px #00000030;

z-index:9999;

display:flex;

justify-content:space-between;

align-items:center;

cursor:pointer

}

.sticky-cart .cart-label{

background:none;

color:#fff;

padding:0;

font-size:15px

}

.sticky-cart .count{

background:#fff;

color:#7b2d26;

border-radius:18px;

padding:3px 9px;

font-size:13px

}

.sticky-cart.hide-cart{

display:none

}

/* FULL SCREEN PHOTO */

.photo-modal{

display:none;

position:fixed;

z-index:10000;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.92);

align-items:center;

justify-content:center;

padding:20px

}

.photo-modal img{

max-width:100%;

max-height:90vh;

object-fit:contain;

border-radius:15px

}

.close-photo{

position:absolute;

top:25px;

right:20px;

width:50px;

height:50px;

border-radius:50%;

background:#fff;

color:#333;

font-size:30px;

font-weight:bold;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

padding:0;

border:0

}

</style>

</head>

<body>

<header>

<div class="wrap">

<h1>Miracle Drinks and Food</h1>

<p>Coco Cafeina • Fresh Food & Drinks</p>

<span class="badge">🚚 Delivery Only</span>

</div>

</header>

<main class="wrap">

<input

class="search-box"

id="searchBox"

type="search"

placeholder="🔍 Search food & drinks..."

oninput="filterProducts()"

>

<div class="filters">

<button class="filter-btn active"

data-category="all"

onclick="setCategory('all',this)">

All

</button>

<button class="filter-btn"

data-category="milkshake"

onclick="setCategory('milkshake',this)">

🥤 Milkshake

</button>

<button class="filter-btn"

data-category="burger"

onclick="setCategory('burger',this)">

🍔 Burger

</button>

<button class="filter-btn"

data-category="roll"

onclick="setCategory('roll',this)">

🌯 Roll & Sandwich

</button>

</div>

<h2 id="milkshakeTitle">🥤 Milkshake</h2>

<div class="grid" id="milkshake"></div>

<h2 id="burgerTitle">🍔 Burger</h2>

<div class="grid" id="burger"></div>

<h2 id="rollTitle">🌯 Roll & Sandwich</h2>

<div class="grid" id="roll"></div>

<div class="no-results" id="noResults" style="display:none">

😔 No food or drink found.

</div>

<section class="cart">

<h2>🛒 Your Order</h2>

<div id="cart">

<p class="empty">Your cart is empty.</p>

</div>

<div class="total" id="total"></div>

<h3>Delivery Details</h3>

<input id="name" placeholder="Your name">

<input id="phone" placeholder="Mobile number">

<textarea

id="address"

rows="3"

placeholder="Full delivery address">

</textarea>

<button class="order" onclick="sendOrder()">

Order on WhatsApp

</button>

</section>

</main>

<footer>

© Miracle Drinks and Food • Coco Cafeina

</footer>

<button

class="sticky-cart"

id="stickyCart"

onclick="document.querySelector('.cart').scrollIntoView({behavior:'smooth'})">

<span class="cart-label">🛒 View Cart</span>

<span class="count" id="cartCount">0</span>

</button>

<div class="photo-modal" id="photoModal">

<button class="close-photo" onclick="closePhoto()">

×

</button>

<img id="fullPhoto" src="" alt="Food">

</div>

<script>

const WA="919945093204";

const products=[

{

name:"Tender Miracle",

price:90,

icon:"🥤",

cat:"milkshake",

img:"tender-miracle.jpeg",

desc:"Fresh tender coconut special drink.",

popular:true

},

{

name:"Milo Magic",

price:90,

icon:"🥤",

cat:"milkshake",

img:"milo-magic.jpeg",

desc:"Creamy and delicious Milo special.",

popular:false

},

{

name:"Tender Mango",

price:80,

icon:"🥭",

cat:"milkshake",

img:"tender-mango.jpeg",

desc:"Refreshing tender coconut & mango blend.",

popular:true

},

{

name:"Tender-Dates",

price:90,

icon:"🥤",

cat:"milkshake",

img:"tender-dates.jpeg",

desc:"Rich tender coconut and dates combination.",

popular:false

},

{

name:"Zinger Burger",

price:90,

icon:"🍔",

cat:"burger",

img:"zinger-burger.jpeg",

desc:"Crispy, tasty and freshly prepared burger.",

popular:true

},

{

name:"Barbecue Honey Burger",

price:120,

icon:"🍔",

cat:"burger",

img:"barbecue-honey-burger.jpeg",

desc:"Juicy burger with barbecue honey flavour.",

popular:true

},

{

name:"Cafeina Jumbo Roll",

price:90,

icon:"🌯",

cat:"roll",

img:"cafeina-jumbo-roll.jpeg",

desc:"Loaded jumbo roll prepared fresh.",

popular:false

},

{

name:"Loaded Sandwich",

price:90,

icon:"🥪",

cat:"roll",

img:"loaded-sandwich.jpeg",

desc:"Fresh and delicious loaded sandwich.",

popular:false

}

];

let cart={};

let selectedCategory="all";

function setCategory(category,button){

selectedCategory=category;

document.querySelectorAll(".filter-btn")

.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

filterProducts();

}

function filterProducts(){

let search=document.getElementById("searchBox")

.value.toLowerCase().trim();

let found=false;

["milkshake","burger","roll"].forEach(cat=>{

let container=document.getElementById(cat);

let title=document.getElementById(cat+"Title");

let visibleProducts=products.filter(p=>{

let categoryMatch=

selectedCategory==="all" || p.cat===selectedCategory;

let searchMatch=

p.name.toLowerCase().includes(search);

return categoryMatch && searchMatch;

});

if(visibleProducts.length){

title.style.display="block";

container.style.display="grid";

container.innerHTML=visibleProducts.map(p=>{

let i=products.indexOf(p);

found=true;

return `

<div class="card">

${p.popular ? '<div class="popular">⭐ Popular</div>' : ''}

<img

class="photo"

src="${p.img}"

alt="${p.name}"

onclick="openPhoto('${p.img}')"

>

<div class="info">

<div>

<h3>${p.icon} ${p.name}</h3>

<p class="description">

${p.desc}

</p>

<div class="price">

₹${p.price}

</div>

</div>

<button

class="add"

onclick="add(${i})">

Add

</button>

</div>

</div>

`;

}).join("");

}else{

title.style.display="none";

container.style.display="none";

}

});

document.getElementById("noResults")

.style.display=found?"none":"block";

}

function add(i){

cart[i]=(cart[i]||0)+1;

renderCart();

}

function remove(i){

cart[i]--;

if(cart[i]<=0)

delete cart[i];

renderCart();

}

function renderCart(){

let keys=Object.keys(cart);

let box=document.getElementById("cart");

let count=Object.values(cart)

.reduce((a,b)=>a+b,0);

document.getElementById("cartCount")

.textContent=count;

if(!keys.length){

box.innerHTML=

'<p class="empty">Your cart is empty.</p>';

document.getElementById("total")

.textContent="";

return;

}

let total=0;

box.innerHTML=keys.map(i=>{

let p=products[i];

let q=cart[i];

total+=p.price*q;

return `

<div class="item">

<span>

${p.name} × ${q}

</span>

<span>

₹${p.price*q}

<span class="qty">

<button onclick="remove(${i})">−</button>

<button onclick="add(${i})">+</button>

</span>

</span>

</div>

`;

}).join("");

document.getElementById("total")

.textContent="Total: ₹"+total;

}

function sendOrder(){

let keys=Object.keys(cart);

if(!keys.length){

alert("Please add an item.");

return;

}

let name=document.getElementById("name")

.value.trim();

let phone=document.getElementById("phone")

.value.trim();

let address=document.getElementById("address")

.value.trim();

if(!name||!phone||!address){

alert(

"Please enter your name, mobile number and delivery address."

);

return;

}

let total=0;

let msg=

"*New Order - Miracle Drinks and Food*%0A%0A";

keys.forEach(i=>{

let p=products[i];

total+=p.price*cart[i];

msg+=

`• ${p.name} × ${cart[i]} = ₹${p.price*cart[i]}%0A`;

});

msg+=

`%0A*Total: ₹${total}*%0A%0A`+

`*Customer:* ${name}%0A`+

`*Phone:* ${phone}%0A`+

`*Delivery Address:* ${address}%0A%0A`+

`🚚 Delivery Only`;

window.open(

"https://wa.me/"+WA+"?text="+msg,

"_blank"

);

}

function openPhoto(src){

document.getElementById("fullPhoto").src=src;

document.getElementById("photoModal")

.style.display="flex";

document.body.style.overflow="hidden";

}

function closePhoto(){

document.getElementById("photoModal")

.style.display="none";

document.getElementById("fullPhoto").src="";

document.body.style.overflow="";

}

document.getElementById("photoModal")

.addEventListener("click",function(e){

if(e.target===this){

closePhoto();

}

});

const stickyCart=

document.getElementById("stickyCart");

const orderSection=

document.querySelector(".cart");

const cartObserver=

new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

stickyCart.classList.add("hide-cart");

}else{

stickyCart.classList.remove("hide-cart");

}

});

},{

threshold:0.15

});

cartObserver.observe(orderSection);

filterProducts();

renderCart();

</script>

</body>

</html>

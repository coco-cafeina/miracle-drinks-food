<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#7b2d26">

<title>Miracle Drinks and Food</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

background:#fffaf6;

color:#2b211e;

font-family:Arial,sans-serif;

padding-bottom:85px

}

header{

background:linear-gradient(135deg,#6f241f,#b85b42);

color:#fff;

padding:28px 18px;

border-radius:0 0 28px 28px

}

.wrap{

max-width:720px;

margin:auto;

padding:18px

}

h1{

margin:0;

font-size:29px

}

header p{

margin:7px 0 0;

opacity:.9

}

.badge{

display:inline-block;

margin-top:12px;

padding:7px 12px;

border-radius:20px;

background:#fff1eb;

color:#7b2d26;

font-size:13px

}

h2{

font-size:21px;

margin:20px 0 12px

}

.grid{

display:grid;

gap:12px

}

.card{

background:#fff;

padding:0;

border-radius:17px;

overflow:hidden;

box-shadow:0 4px 18px #00000010

}

.photo{

width:100%;

height:190px;

object-fit:cover;

display:block;

cursor:pointer

}

.info{

padding:15px;

display:flex;

align-items:center;

justify-content:space-between;

gap:12px

}

.card h3{

margin:0 0 5px;

font-size:17px

}

.price{

font-weight:bold;

color:#7b2d26

}

button{

border:0;

border-radius:11px;

padding:10px 14px;

font-weight:bold

}

.add{

background:#7b2d26;

color:#fff

}

.cart{

margin-top:25px;

background:#fff;

padding:18px;

border-radius:18px;

box-shadow:0 4px 18px #00000010

}

.item{

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #eee;

padding:9px 0

}

.qty button{

padding:5px 9px;

margin-left:4px

}

.total{

font-size:19px;

font-weight:bold;

margin:14px 0

}

input,textarea{

width:100%;

padding:12px;

margin:5px 0 9px;

border:1px solid #ddd;

border-radius:11px;

font-size:15px

}

.order{

width:100%;

background:#25d366;

color:white;

font-size:16px;

margin-top:8px

}

.empty{

color:#777

}

footer{

text-align:center;

color:#888;

font-size:12px;

padding:25px

}

/* STICKY CART */

.sticky-cart{

position:fixed;

bottom:15px;

left:50%;

transform:translateX(-50%);

width:calc(100% - 30px);

max-width:690px;

background:#7b2d26;

color:#fff;

border:0;

border-radius:15px;

padding:14px 18px;

font-size:16px;

font-weight:bold;

box-shadow:0 6px 20px #00000035;

z-index:9999;

display:flex;

justify-content:space-between;

align-items:center;

cursor:pointer;

transition:opacity .2s ease

}

.sticky-cart span{

background:#fff;

color:#7b2d26;

border-radius:20px;

padding:3px 9px;

font-size:13px

}

.sticky-cart.hide-cart{

display:none

}

/* FULL SCREEN PHOTO */

.photo-modal{

display:none;

position:fixed;

z-index:10000;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.88);

align-items:center;

justify-content:center;

padding:20px

}

.photo-modal img{

max-width:100%;

max-height:90vh;

object-fit:contain;

border-radius:15px

}

.close-photo{

position:absolute;

top:25px;

right:20px;

width:50px;

height:50px;

border-radius:50%;

background:#fff;

color:#333;

font-size:30px;

font-weight:bold;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

padding:0

}

</style>

</head>

<body>

<header>

<div class="wrap">

<h1>Miracle Drinks and Food</h1>

<p>Coco Cafeina • Fresh Food & Drinks</p>

<span class="badge">

🚚 Delivery Only

</span>

</div>

</header>

<main class="wrap">

<h2>🥤 Milkshake</h2>

<div class="grid" id="milkshake"></div>

<h2>🍔 Burger</h2>

<div class="grid" id="burger"></div>

<h2>🌯 Roll & Sandwich</h2>

<div class="grid" id="roll"></div>

<section class="cart">

<h2>🛒 Your Order</h2>

<div id="cart">

<p class="empty">

Your cart is empty.

</p>

</div>

<div class="total" id="total"></div>

<h3>Delivery Details</h3>

<input

id="name"

placeholder="Your name"

>

<input

id="phone"

placeholder="Mobile number"

>

<textarea

id="address"

rows="3"

placeholder="Full delivery address"

></textarea>

<button

class="order"

onclick="sendOrder()"

>

Order on WhatsApp

</button>

</section>

</main>

<footer>

© Miracle Drinks and Food • Coco Cafeina

</footer>

<!-- STICKY VIEW CART -->

<button

class="sticky-cart"

id="stickyCart"

onclick="document.querySelector('.cart').scrollIntoView({behavior:'smooth'})"

>

<span style="background:none;color:white;padding:0">

🛒 View Cart

</span>

<span id="cartCount">

0

</span>

</button>

<!-- FULL SCREEN PHOTO -->

<div

class="photo-modal"

id="photoModal"

>

<button

class="close-photo"

onclick="closePhoto()"

>

×

</button>

<img

id="fullPhoto"

src=""

alt="Food"

>

</div>

<script>

const WA="919945093204";

const products=[

{

name:"Tender Miracle",

price:90,

icon:"🥤",

cat:"milkshake",

img:"tender-miracle.jpeg"

},

{

name:"Milo Magic",

price:90,

icon:"🥤",

cat:"milkshake",

img:"milo-magic.jpeg"

},

{

name:"Tender Mango",

price:80,

icon:"🥭",

cat:"milkshake",

img:"tender-mango.jpeg"

},

{

name:"Tender-Dates",

price:90,

icon:"🥤",

cat:"milkshake",

img:"tender-dates.jpeg"

},

{

name:"Zinger Burger",

price:90,

icon:"🍔",

cat:"burger",

img:"zinger-burger.jpeg"

},

{

name:"Barbecue Honey Burger",

price:120,

icon:"🍔",

cat:"burger",

img:"barbecue-honey-burger.jpeg"

},

{

name:"Cafeina Jumbo Roll",

price:90,

icon:"🌯",

cat:"roll",

img:"cafeina-jumbo-roll.jpeg"

},

{

name:"Loaded Sandwich",

price:90,

icon:"🥪",

cat:"roll",

img:"loaded-sandwich.jpeg"

}

];

let cart={};

/* RENDER MENU */

function renderMenu(){

["milkshake","burger","roll"].forEach(cat=>{

document.getElementById(cat).innerHTML=

products.map((p,i)=>{

if(p.cat!==cat) return "";

return `

<div class="card">

<img

class="photo"

src="${p.img}"

alt="${p.name}"

onclick="openPhoto('${p.img}')"

>

<div class="info">

<div>

<h3>

${p.icon} ${p.name}

</h3>

<div class="price">

₹${p.price}

</div>

</div>

<button

class="add"

onclick="add(${i})"

>

Add

</button>

</div>

</div>

`;

}).join("");

});

}

/* ADD ITEM */

function add(i){

cart[i]=(cart[i]||0)+1;

renderCart();

}

/* REMOVE ITEM */

function remove(i){

cart[i]--;

if(cart[i]<=0){

delete cart[i];

}

renderCart();

}

/* RENDER CART */

function renderCart(){

let keys=Object.keys(cart);

let box=document.getElementById("cart");

let count=Object.values(cart)

.reduce((a,b)=>a+b,0);

/* UPDATE CART COUNT */

document.getElementById("cartCount").textContent=count;

if(!keys.length){

box.innerHTML=

'<p class="empty">Your cart is empty.</p>';

document.getElementById("total").textContent="";

return;

}

let total=0;

box.innerHTML=

keys.map(i=>{

let p=products[i];

let q=cart[i];

total+=p.price*q;

return `

<div class="item">

<span>

${p.name} × ${q}

</span>

<span>

₹${p.price*q}

<span class="qty">

<button

onclick="remove(${i})"

>

−

</button>

<button

onclick="add(${i})"

>

+

</button>

</span>

</span>

</div>

`;

}).join("");

document.getElementById("total").textContent=

"Total: ₹"+total;

}

/* WHATSAPP ORDER */

function sendOrder(){

let keys=Object.keys(cart);

if(!keys.length){

alert("Please add an item.");

return;

}

let name=

document.getElementById("name")

.value.trim();

let phone=

document.getElementById("phone")

.value.trim();

let address=

document.getElementById("address")

.value.trim();

if(!name||!phone||!address){

alert(

"Please enter your name, mobile number and delivery address."

);

return;

}

let total=0;

let msg=

"*New Order - Miracle Drinks and Food*%0A%0A";

keys.forEach(i=>{

let p=products[i];

total+=p.price*cart[i];

msg+=

`• ${p.name} × ${cart[i]} = ₹${p.price*cart[i]}%0A`;

});

msg+=

`%0A*Total: ₹${total}*%0A%0A`+

`*Customer:* ${name}%0A`+

`*Phone:* ${phone}%0A`+

`*Delivery Address:* ${address}%0A%0A`+

`🚚 Delivery Only`;

window.open(

"https://wa.me/"+WA+"?text="+msg,

"_blank"

);

}

/* FULL SCREEN PHOTO */

function openPhoto(src){

document.getElementById("fullPhoto").src=src;

document.getElementById("photoModal").style.display="flex";

document.body.style.overflow="hidden";

}

function closePhoto(){

document.getElementById("photoModal").style.display="none";

document.getElementById("fullPhoto").src="";

document.body.style.overflow="";

}

/* TAP OUTSIDE PHOTO TO CLOSE */

document.getElementById("photoModal")

.addEventListener("click",function(e){

if(e.target===this){

closePhoto();

}

});

/* HIDE VIEW CART WHEN ORDER SECTION IS VISIBLE */

const stickyCart=

document.getElementById("stickyCart");

const orderSection=

document.querySelector(".cart");

const cartObserver=

new IntersectionObserver(

(entries)=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

stickyCart.classList.add("hide-cart");

}else{

stickyCart.classList.remove("hide-cart");

}

});

},

{

threshold:0.15

}

);

cartObserver.observe(orderSection);

/* START */

renderMenu();

renderCart();

</script>

</body>

</html>

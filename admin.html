<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#174d35">

<title>COCO CAFEINA • Admin Orders</title>

<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#f6f7f5;

  color:#222;

  font-family:Arial,sans-serif

}

.top{

  background:linear-gradient(135deg,#123d2b,#1f6848);

  color:#fff;

  padding:18px;

  position:sticky;

  top:0;

  z-index:10

}

.top-inner{

  max-width:1100px;

  margin:auto;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px

}

.top h1{

  margin:0;

  font-size:21px

}

.btn{

  border:0;

  border-radius:10px;

  padding:10px 13px;

  font-weight:bold;

  cursor:pointer

}

.logout{

  background:#fff;

  color:#174d35

}

.wrap{

  max-width:1100px;

  margin:auto;

  padding:18px

}

/* LOGIN */

.login{

  max-width:420px;

  margin:50px auto;

  background:#fff;

  padding:22px;

  border-radius:18px;

  box-shadow:0 5px 25px #00000012

}

.login h2{

  margin-top:0;

  color:#174d35

}

.login input{

  width:100%;

  padding:13px;

  margin:6px 0 10px;

  border:1px solid #ddd;

  border-radius:10px;

  font-size:15px

}

.primary{

  width:100%;

  background:#174d35;

  color:#fff

}

.error{

  color:#b42318;

  font-size:13px;

  margin:8px 0

}

/* DASHBOARD */

.dashboard{

  margin-bottom:22px

}

.dashboard-title{

  font-size:20px;

  font-weight:bold;

  color:#174d35;

  margin:0 0 12px

}

.dashboard-grid{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:12px

}

.stat-card{

  background:#fff;

  border-radius:16px;

  padding:17px;

  border:1px solid #e8ece8;

  box-shadow:0 4px 18px #0000000c

}

.stat-icon{

  font-size:25px

}

.stat-label{

  color:#666;

  font-size:13px;

  margin-top:7px

}

.stat-value{

  font-size:26px;

  font-weight:bold;

  color:#174d35;

  margin-top:5px

}

/* DATE REPORT */

.date-report{

  background:#fff;

  border:1px solid #e8ece8;

  border-radius:16px;

  padding:17px;

  margin-bottom:20px;

  box-shadow:0 4px 18px #0000000c

}

.date-report-title{

  font-size:17px;

  font-weight:bold;

  color:#174d35;

  margin-bottom:12px

}

.date-controls{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  align-items:center

}

.date-controls input{

  padding:11px;

  border:1px solid #ddd;

  border-radius:10px;

  background:#fff;

  font-size:15px

}

.date-results{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:12px;

  margin-top:14px

}

.date-result{

  background:#f6f7f5;

  border-radius:12px;

  padding:14px

}

.date-result-label{

  color:#666;

  font-size:13px

}

.date-result-value{

  color:#174d35;

  font-size:22px;

  font-weight:bold;

  margin-top:4px

}

/* TOOLBAR */

.toolbar{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:16px

}

.toolbar input,

.toolbar select{

  padding:11px;

  border:1px solid #ddd;

  border-radius:10px;

  background:#fff

}

/* ORDERS */

.orders{

  display:grid;

  gap:14px

}

.order-card{

  background:#fff;

  border-radius:16px;

  padding:16px;

  box-shadow:0 4px 18px #00000010;

  border:1px solid #e8ece8

}

.order-head{

  display:flex;

  justify-content:space-between;

  gap:10px;

  align-items:flex-start

}

.order-id{

  font-size:12px;

  color:#777;

  word-break:break-all

}

.customer{

  font-size:18px;

  font-weight:bold;

  color:#174d35

}

.meta{

  font-size:13px;

  color:#555;

  line-height:1.5;

  margin:8px 0

}

.items{

  border-top:1px solid #eee;

  border-bottom:1px solid #eee;

  padding:8px 0;

  margin:10px 0

}

.item-row{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:6px 0;

  font-size:14px

}

.free{

  color:#174d35;

  font-weight:bold

}

.bottom{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  flex-wrap:wrap

}

.total{

  font-size:19px;

  font-weight:bold;

  color:#174d35

}

.status{

  padding:9px;

  border-radius:9px;

  border:1px solid #ddd;

  background:#fff;

  font-weight:bold

}

.empty,

.loading{

  padding:35px;

  text-align:center;

  color:#777;

  background:#fff;

  border-radius:16px

}

.hidden{

  display:none!important

}

@media(max-width:800px){

  .dashboard-grid{

    grid-template-columns:repeat(2,1fr)

  }

}

@media(max-width:600px){

  .wrap{

    padding:12px

  }

  .top-inner{

    align-items:flex-start

  }

  .top h1{

    font-size:18px

  }

  .order-head{

    display:block

  }

  .bottom{

    align-items:flex-start

  }

  .date-results{

    grid-template-columns:1fr

  }

  .dashboard-grid{

    grid-template-columns:repeat(2,1fr);

    gap:9px

  }

  .stat-card{

    padding:13px

  }

  .stat-value{

    font-size:22px

  }

}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginView" class="login">

  <h2>🥥 COCO CAFEINA</h2>

  <p>Admin Orders</p>

  <input

    id="email"

    type="email"

    placeholder="Admin email"

    autocomplete="username">

  <input

    id="password"

    type="password"

    placeholder="Password"

    autocomplete="current-password">

  <div id="loginError" class="error"></div>

  <button class="btn primary" onclick="login()">

    🔐 LOGIN

  </button>

</div>

<!-- ADMIN APP -->

<div id="appView" class="hidden">

<header class="top">

  <div class="top-inner">

    <h1>🥥 COCO CAFEINA • Orders</h1>

    <button class="btn logout" onclick="logout()">

      Logout

    </button>

  </div>

</header>

<main class="wrap">

<!-- DASHBOARD -->

<section class="dashboard">

  <div class="dashboard-title">

    📊 Admin Dashboard

  </div>

  <div class="dashboard-grid">

    <div class="stat-card">

      <div class="stat-icon">📊</div>

      <div class="stat-label">TODAY'S ORDERS</div>

      <div class="stat-value" id="todayOrders">0</div>

    </div>

    <div class="stat-card">

      <div class="stat-icon">💰</div>

      <div class="stat-label">TODAY'S SALES</div>

      <div class="stat-value" id="todaySales">₹0</div>

    </div>

    <div class="stat-card">

      <div class="stat-icon">📦</div>

      <div class="stat-label">PENDING ORDERS</div>

      <div class="stat-value" id="pendingOrders">0</div>

    </div>

    <div class="stat-card">

      <div class="stat-icon">🚚</div>

      <div class="stat-label">OUT FOR DELIVERY</div>

      <div class="stat-value" id="deliveryOrders">0</div>

    </div>

  </div>

</section>

<!-- DATE WISE REPORT -->

<section class="date-report">

  <div class="date-report-title">

    📅 Date-wise Sales & Orders

  </div>

  <div class="date-controls">

    <input

      type="date"

      id="reportDate"

      onchange="updateDateReport()">

    <button

      class="btn"

      onclick="setTodayReport()">

      📅 Today

    </button>

    <button

      class="btn"

      onclick="updateDateReport()">

      🔄 Refresh Report

    </button>

  </div>

  <div class="date-results">

    <div class="date-result">

      <div class="date-result-label">

        📦 Orders on selected date

      </div>

      <div

        class="date-result-value"

        id="selectedDateOrders">

        0

      </div>

    </div>

    <div class="date-result">

      <div class="date-result-label">

        💰 Sales on selected date

      </div>

      <div

        class="date-result-value"

        id="selectedDateSales">

        ₹0

      </div>

    </div>

  </div>

</section>

<!-- ORDER SEARCH -->

<div class="toolbar">

  <input

    id="search"

    placeholder="🔍 Search customer / phone / order ID"

    oninput="renderOrders()">

  <select

    id="statusFilter"

    onchange="renderOrders()">

    <option value="all">

      All Status

    </option>

    <option value="pending">

      Pending

    </option>

    <option value="confirmed">

      Confirmed

    </option>

    <option value="preparing">

      Preparing

    </option>

    <option value="out_for_delivery">

      Out for delivery

    </option>

    <option value="delivered">

      Delivered

    </option>

    <option value="cancelled">

      Cancelled

    </option>

  </select>

  <button

    class="btn"

    onclick="loadOrders()">

    🔄 Refresh

  </button>

</div>

<!-- ORDERS -->

<div id="orders" class="orders">

  <div class="loading">

    Loading orders...

  </div>

</div>

</main>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {

  apiKey:"AIzaSyABdyflDhA_syt9igT9bkjwAjzDQbdl760",

  authDomain:"coco-cafeina.firebaseapp.com",

  projectId:"coco-cafeina",

  storageBucket:"coco-cafeina.firebasestorage.app",

  messagingSenderId:"1001937326141",

  appId:"1:1001937326141:web:206c27faba6590c2199a54"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

let orders = [];

/* AUTH */

auth.onAuthStateChanged(u => {

  if(u){

    document.getElementById("loginView")

      .classList.add("hidden");

    document.getElementById("appView")

      .classList.remove("hidden");

    setTodayReport();

    loadOrders();

  }else{

    document.getElementById("loginView")

      .classList.remove("hidden");

    document.getElementById("appView")

      .classList.add("hidden");

  }

});

/* LOGIN */

async function login(){

  const e =

    document.getElementById("email")

    .value.trim();

  const p =

    document.getElementById("password")

    .value;

  const er =

    document.getElementById("loginError");

  er.textContent = "";

  if(!e || !p){

    er.textContent =

      "Enter email and password.";

    return;

  }

  try{

    await auth.signInWithEmailAndPassword(

      e,

      p

    );

  }catch(x){

    console.error(x);

    er.textContent =

      "Login failed. Check the admin account and password.";

  }

}

/* LOGOUT */

function logout(){

  auth.signOut();

}

/* LOAD ORDERS */

async function loadOrders(){

  const ordersEl =

    document.getElementById("orders");

  ordersEl.innerHTML =

    '<div class="loading">Loading orders...</div>';

  try{

    /*

      Load latest 500 orders.

      This gives the dashboard more data

      for date-wise calculations.

    */

    const s =

      await db

        .collection("orders")

        .orderBy("createdAt","desc")

        .limit(500)

        .get();

    orders =

      s.docs.map(d => ({

        id:d.id,

        ...d.data()

      }));

    updateDashboard();

    updateDateReport();

    renderOrders();

  }catch(e){

    console.error(e);

    ordersEl.innerHTML =

      '<div class="empty">Could not load orders. Check Firestore Rules and Authentication.</div>';

  }

}

/* DATE HELPERS */

function getDateKey(value){

  if(!value) return "";

  try{

    let d;

    if(

      value &&

      typeof value.toDate === "function"

    ){

      d = value.toDate();

    }else{

      d = new Date(value);

    }

    if(isNaN(d.getTime())) return "";

    const y =

      d.getFullYear();

    const m =

      String(d.getMonth()+1)

      .padStart(2,"0");

    const day =

      String(d.getDate())

      .padStart(2,"0");

    return `${y}-${m}-${day}`;

  }catch(e){

    return "";

  }

}

function todayKey(){

  return getDateKey(

    new Date()

  );

}

/* SET TODAY */

function setTodayReport(){

  const input =

    document.getElementById("reportDate");

  input.value =

    todayKey();

  updateDateReport();

}

/* DASHBOARD */

function updateDashboard(){

  const today =

    todayKey();

  let todayCount = 0;

  let todaySales = 0;

  let pending = 0;

  let delivery = 0;

  orders.forEach(o => {

    const status =

      o.status || "pending";

    /*

      Today's orders

    */

    if(

      getDateKey(o.createdAt) === today

    ){

      todayCount++;

      /*

        Cancelled orders are not included

        in today's sales.

      */

      if(status !== "cancelled"){

        todaySales +=

          Number(o.total || 0);

      }

    }

    /*

      Current pending count

    */

    if(status === "pending"){

      pending++;

    }

    /*

      Current out-for-delivery count

    */

    if(status === "out_for_delivery"){

      delivery++;

    }

  });

  document.getElementById("todayOrders")

    .textContent = todayCount;

  document.getElementById("todaySales")

    .textContent =

      "₹" + todaySales.toLocaleString("en-IN");

  document.getElementById("pendingOrders")

    .textContent = pending;

  document.getElementById("deliveryOrders")

    .textContent = delivery;

}

/* DATE-WISE REPORT */

function updateDateReport(){

  const selected =

    document.getElementById("reportDate").value;

  if(!selected){

    return;

  }

  let count = 0;

  let sales = 0;

  orders.forEach(o => {

    if(

      getDateKey(o.createdAt) === selected

    ){

      count++;

      if(

        (o.status || "pending")

        !== "cancelled"

      ){

        sales +=

          Number(o.total || 0);

      }

    }

  });

  document.getElementById(

    "selectedDateOrders"

  ).textContent = count;

  document.getElementById(

    "selectedDateSales"

  ).textContent =

    "₹" + sales.toLocaleString("en-IN");

}

/* DATE TEXT */

function dateText(ts){

  if(!ts)

    return "Date pending";

  try{

    return ts.toDate()

      .toLocaleString(

        "en-IN",

        {

          dateStyle:"medium",

          timeStyle:"short"

        }

      );

  }catch(e){

    return "Date pending";

  }

}

/* STATUS LABEL */

function label(s){

  return (s || "pending")

    .replaceAll("_"," ")

    .replace(

      /\b\w/g,

      c => c.toUpperCase()

    );

}

/* HTML ESCAPE */

function esc(v){

  return String(v ?? "")

    .replace(

      /[&<>"']/g,

      c => ({

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#39;"

      }[c])

    );

}

/* RENDER ORDERS */

function renderOrders(){

  const q =

    document

      .getElementById("search")

      .value

      .toLowerCase()

      .trim();

  const f =

    document

      .getElementById("statusFilter")

      .value;

  const arr =

    orders.filter(o =>

      (

        !q ||

        [

          o.id,

          o.customerName,

          o.phone,

          o.address

        ]

        .join(" ")

        .toLowerCase()

        .includes(q)

      )

      &&

      (

        f === "all" ||

        (o.status || "pending") === f

      )

    );

  const box =

    document.getElementById("orders");

  if(!arr.length){

    box.innerHTML =

      '<div class="empty">No orders found.</div>';

    return;

  }

  box.innerHTML =

    arr.map(o => {

      const items =

        (o.items || [])

        .map(i =>

          `<div class="item-row">

            <span>

              ${esc(i.icon || "")}

              ${esc(i.name)}

              × ${esc(i.quantity)}

            </span>

            <b>

              ₹${Number(i.itemTotal || 0)}

            </b>

          </div>`

        )

        .join("");

      const free =

        (o.freeItems || [])

        .map(i =>

          `<div class="item-row free">

            <span>

              🎁

              ${esc(i.icon || "")}

              ${esc(i.name)}

              × ${esc(i.quantity)}

            </span>

            <span>

              FREE

            </span>

          </div>`

        )

        .join("");

      return `

      <article class="order-card">

        <div class="order-head">

          <div>

            <div class="customer">

              👤

              ${esc(

                o.customerName ||

                "Customer"

              )}

            </div>

            <div class="order-id">

              Order ID:

              ${esc(o.id)}

            </div>

          </div>

          <select

            class="status"

            onchange="updateStatus(

              '${esc(o.id)}',

              this.value

            )">

            ${

              [

                "pending",

                "confirmed",

                "preparing",

                "out_for_delivery",

                "delivered",

                "cancelled"

              ]

              .map(s =>

                `<option

                  value="${s}"

                  ${

                    (o.status || "pending")

                    === s

                    ? "selected"

                    : ""

                  }>

                  ${label(s)}

                </option>`

              )

              .join("")

            }

          </select>

        </div>

        <div class="meta">

          📞

          <a

            href="tel:${esc(o.phone || "")}">

            ${esc(o.phone || "")}

          </a>

          <br>

          📍

          ${esc(o.address || "")}

          <br>

          🚚

          ${esc(

            o.deliveryArea ||

            "Deralakatte → Thokkottu"

          )}

          <br>

          🕒

          ${dateText(o.createdAt)}

        </div>

        <div class="items">

          ${items}

          ${free}

        </div>

        <div class="bottom">

          <div class="total">

            Total:

            ₹${Number(o.total || 0)}

          </div>

          <a

            class="btn"

            href="https://wa.me/${

              encodeURIComponent(

                (o.phone || "")

                .replace(/\D/g,"")

              )

            }"

            target="_blank">

            💬 WhatsApp Customer

          </a>

        </div>

      </article>

      `;

    })

    .join("");

}

/* UPDATE ORDER STATUS */

async function updateStatus(id,status){

  try{

    await db

      .collection("orders")

      .doc(id)

      .update({

        status:status,

        statusUpdatedAt:

          firebase.firestore

          .FieldValue

          .serverTimestamp()

      });

    const o =

      orders.find(

        x => x.id === id

      );

    if(o){

      o.status = status;

    }

    /*

      Refresh dashboard immediately

    */

    updateDashboard();

    updateDateReport();

    renderOrders();

  }catch(e){

    alert(

      "Status update failed. Check Firestore Rules."

    );

    console.error(e);

  }

}

</script>

</body>

</html>

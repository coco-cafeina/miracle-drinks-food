<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d35"><title>COCO CAFEINA • Admin Orders</title>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#222;font-family:Arial,sans-serif}.top{background:linear-gradient(135deg,#123d2b,#1f6848);color:#fff;padding:18px;position:sticky;top:0;z-index:10}.top-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:21px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;cursor:pointer}.logout{background:#fff;color:#174d35}.wrap{max-width:1100px;margin:auto;padding:18px}.login{max-width:420px;margin:50px auto;background:#fff;padding:22px;border-radius:18px;box-shadow:0 5px 25px #00000012}.login h2{margin-top:0;color:#174d35}.login input{width:100%;padding:13px;margin:6px 0 10px;border:1px solid #ddd;border-radius:10px;font-size:15px}.primary{width:100%;background:#174d35;color:#fff}.error{color:#b42318;font-size:13px;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff}.orders{display:grid;gap:14px}.order-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #00000010;border:1px solid #e8ece8}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order-id{font-size:12px;color:#777;word-break:break-all}.customer{font-size:18px;font-weight:bold;color:#174d35}.meta{font-size:13px;color:#555;line-height:1.5;margin:8px 0}.items{border-top:1px solid #eee;border-bottom:1px solid #eee;padding:8px 0;margin:10px 0}.item-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}.free{color:#174d35;font-weight:bold}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.total{font-size:19px;font-weight:bold;color:#174d35}.status{padding:9px;border-radius:9px;border:1px solid #ddd;background:#fff;font-weight:bold}.empty,.loading{padding:35px;text-align:center;color:#777;background:#fff;border-radius:16px}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:12px}.top-inner{align-items:flex-start}.top h1{font-size:18px}.order-head{display:block}.bottom{align-items:flex-start}}
</style></head><body>
<div id="loginView" class="login"><h2>🥥 COCO CAFEINA</h2><p>Admin Orders</p><input id="email" type="email" placeholder="Admin email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><div id="loginError" class="error"></div><button class="btn primary" onclick="login()">🔐 LOGIN</button></div>
<div id="appView" class="hidden"><header class="top"><div class="top-inner"><h1>🥥 COCO CAFEINA • Orders</h1><button class="btn logout" onclick="logout()">Logout</button></div></header><main class="wrap"><div class="toolbar"><input id="search" placeholder="🔍 Search customer / phone / order ID" oninput="renderOrders()"><select id="statusFilter" onchange="renderOrders()"><option value="all">All Status</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="preparing">Preparing</option><option value="out_for_delivery">Out for delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select><button class="btn" onclick="loadOrders()">🔄 Refresh</button></div><div id="orders" class="orders"><div class="loading">Loading orders...</div></div></main></div>
<script>
const firebaseConfig={apiKey:"AIzaSyABdyflDhA_syt9igT9bkjwAjzDQbdl760",authDomain:"coco-cafeina.firebaseapp.com",projectId:"coco-cafeina",storageBucket:"coco-cafeina.firebasestorage.app",messagingSenderId:"1001937326141",appId:"1:1001937326141:web:206c27faba6590c2199a54"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let orders=[];
auth.onAuthStateChanged(u=>{if(u){loginView.classList.add("hidden");appView.classList.remove("hidden");loadOrders()}else{loginView.classList.remove("hidden");appView.classList.add("hidden")}});
async function login(){let e=email.value.trim(),p=password.value,er=loginError;er.textContent="";if(!e||!p){er.textContent="Enter email and password.";return}try{await auth.signInWithEmailAndPassword(e,p)}catch(x){console.error(x);er.textContent="Login failed. Check the admin account and password."}}
function logout(){auth.signOut()}
async function loadOrders(){ordersEl=document.getElementById("orders");ordersEl.innerHTML='<div class="loading">Loading orders...</div>';try{let s=await db.collection("orders").orderBy("createdAt","desc").limit(100).get();orders=s.docs.map(d=>({id:d.id,...d.data()}));renderOrders()}catch(e){console.error(e);ordersEl.innerHTML='<div class="empty">Could not load orders. Check Firestore Rules and Authentication.</div>'}}
function dateText(ts){if(!ts)return"Date pending";try{return ts.toDate().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})}catch(e){return"Date pending"}}
function label(s){return(s||"pending").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase())}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderOrders(){let q=document.getElementById("search").value.toLowerCase().trim(),f=document.getElementById("statusFilter").value,arr=orders.filter(o=>(!q||[o.id,o.customerName,o.phone,o.address].join(" ").toLowerCase().includes(q))&&(f==="all"||(o.status||"pending")===f)),box=document.getElementById("orders");if(!arr.length){box.innerHTML='<div class="empty">No orders found.</div>';return}box.innerHTML=arr.map(o=>{let items=(o.items||[]).map(i=>`<div class="item-row"><span>${esc(i.icon||"")} ${esc(i.name)} × ${esc(i.quantity)}</span><b>₹${Number(i.itemTotal||0)}</b></div>`).join(""),free=(o.freeItems||[]).map(i=>`<div class="item-row free"><span>🎁 ${esc(i.icon||"")} ${esc(i.name)} × ${esc(i.quantity)}</span><span>FREE</span></div>`).join("");return `<article class="order-card"><div class="order-head"><div><div class="customer">👤 ${esc(o.customerName||"Customer")}</div><div class="order-id">Order ID: ${esc(o.id)}</div></div><select class="status" onchange="updateStatus('${o.id}',this.value)">${["pending","confirmed","preparing","out_for_delivery","delivered","cancelled"].map(s=>`<option value="${s}" ${(o.status||"pending")===s?"selected":""}>${label(s)}</option>`).join("")}</select></div><div class="meta">📞 <a href="tel:${esc(o.phone||"")}">${esc(o.phone||"")}</a><br>📍 ${esc(o.address||"")}<br>🚚 ${esc(o.deliveryArea||"Deralakatte → Thokkottu")}<br>🕒 ${dateText(o.createdAt)}</div><div class="items">${items}${free}</div><div class="bottom"><div class="total">Total: ₹${Number(o.total||0)}</div><a class="btn" href="https://wa.me/${encodeURIComponent((o.phone||"").replace(/\D/g,""))}" target="_blank">💬 WhatsApp Customer</a></div></article>`}).join("")}
async function updateStatus(id,status){try{await db.collection("orders").doc(id).update({status,statusUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()});let o=orders.find(x=>x.id===id);if(o)o.status=status;renderOrders()}catch(e){alert("Status update failed. Check Firestore Rules.");console.error(e)}}
</script></body></html>
